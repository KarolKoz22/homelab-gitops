# Locally-managed Cloudflare Tunnel: routing lives here in git, not in the
# Cloudflare dashboard. Outbound-only, so no ports are opened on the laptop.
#
# Only two read-only Argo CD endpoints are published, both used by the live
# panel on karolkozlowski.pl/projects (Vercel calls them with the read-only
# "portal" token): the application list and each application's resource tree
# (the dependency graph). Everything else, including the UI, manifests, logs
# and the login endpoint, gets a 404 from cloudflared and never reaches the cluster.
tunnel: bd8ad1e4-90a7-4882-b606-e53aefb87b83
credentials-file: /etc/cloudflared/creds/credentials.json
metrics: 0.0.0.0:2000
no-autoupdate: true
ingress:
  - hostname: argocd-api.karolkozlowski.pl
    path: ^/api/v1/applications(/[a-z0-9-]+/resource-tree)?$
    service: https://argocd-server.argocd.svc.cluster.local:443
    originRequest:
      # argocd-server's own self-signed cert; the public side uses Cloudflare's.
      noTLSVerify: true
  - service: http_status:404
