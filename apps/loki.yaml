# Loki: log storage + LogQL query engine (single-binary, filesystem on a PVC).
# Fed by Alloy (apps/alloy.yaml), queried by Grafana.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.5.0           # Loki 3.6.16
      helm:
        releaseName: loki
        valueFiles:
          - $values/values/loki.yaml
    - repoURL: https://github.com/KarolKoz22/homelab-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
