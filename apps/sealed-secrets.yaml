# Sealed Secrets controller: decrypts SealedSecret objects committed to this
# repo into normal Kubernetes Secrets. The private key never leaves the cluster.
# Encrypt with: kubeseal --format yaml < secret.yaml > sealed-secret.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0          # controller v0.41.2
    helm:
      valuesObject:
        # kubeseal looks for "sealed-secrets-controller" in kube-system by
        # default, so with these two names it needs no extra flags.
        fullnameOverride: sealed-secrets-controller
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        # TODO: enable metrics.serviceMonitor once kube-prometheus-stack
        # (which provides the ServiceMonitor CRD) is installed.
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
